name: Render documentation previews
on:
  workflow_dispatch:
  push:
    branches: ['docs/**']
    paths:
      - 'scripts/render_readme_previews.mjs'
      - '.github/workflows/docs-previews.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/render_readme_previews.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-mobile-previews
          path: dist/readme-previews/
          retention-days: 7
