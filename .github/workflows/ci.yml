name: CI
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/security_check.py source
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: python3 scripts/prepare_upstream.py
      - run: cargo fmt --all --check
      - run: node --check crates/panel/assets/app.js && node --check scripts/browser_smoke.mjs
      - run: cargo clippy --locked -p solartt-control-api -p solartt-policy -p solartt-profile-export -p solartt-panel -p solartt-admin --all-targets -- -D warnings
      - run: cargo test --locked -p solartt-control-api -p solartt-policy -p solartt-profile-export -p solartt-panel -p solartt-admin
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev pkg-config python3-h2 openssl haproxy
      - run: python3 scripts/prepare_upstream.py
      - run: python3 scripts/prepare_client.py
      - run: python3 scripts/prepare_caddy.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: native-ubuntu24-rust1.95-${{ hashFiles('Cargo.lock', 'upstream/pin.json', 'upstream/*.patch') }}
      - run: cargo test --locked -p solartt-agent -- --test-threads=1
      - run: cargo build --locked --release -p solartt-agent -p solartt-panel -p solartt-admin
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Isolated release measurements
        run: |
          mkdir -p dist
          cargo test --locked --release -p solartt-agent --test transport measure_loopback_transport_and_durable_leases -- --ignored --nocapture --test-threads=1 | tee dist/measurements.txt
      - run: cargo metadata --locked --format-version 1 | python3 scripts/licenses.py
      - run: python3 scripts/package.py
      - run: python3 scripts/package_verify.py
      - run: python3 scripts/package_smoke.py
      - name: Scan unpacked packages and artifact files for secrets
        run: python3 scripts/security_check.py artifacts
      - name: Service diagnostics on failure
        if: failure()
        run: sudo journalctl -u solartt-agent.service -u solartt-panel.service --no-pager -n 100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solartt-linux-x86_64-development
          path: dist/
          retention-days: 7
  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev pkg-config
      - run: python3 scripts/prepare_upstream.py
      - name: Resolve the reviewed h2 upgrade against the upstream lockfile
        run: cargo update --manifest-path .upstream/lib/Cargo.toml --workspace
      - name: Patched upstream regression tests with upstream lockfile
        run: cargo test --manifest-path .upstream/lib/Cargo.toml --locked --lib -- --test-threads=1
        env:
          CARGO_TARGET_DIR: target/upstream-regression
