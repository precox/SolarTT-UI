name: CI
on:
  push:
    branches: [main, 'dev/**']
    tags: ['v*-alpha.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/security_check.py source
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: python3 scripts/prepare_upstream.py
      - run: cargo fmt --all --check
      - run: node --check crates/panel/assets/app.js && node --check scripts/browser_smoke.mjs
      - run: node --test scripts/panel_state_tests.mjs
      - run: python3 -B -m unittest discover -s scripts -p test_release_tools.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_*trusttunnel*.py'
      - run: cargo clippy --locked -p solartt-control-api -p solartt-policy -p solartt-profile-export -p solartt-panel -p solartt-admin --all-targets -- -D warnings
      - run: cargo test --locked -p solartt-control-api -p solartt-policy -p solartt-profile-export -p solartt-panel -p solartt-admin
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev pkg-config python3-h2 openssl haproxy
      - run: python3 scripts/prepare_upstream.py
      - run: python3 scripts/prepare_client.py
      - run: python3 scripts/prepare_caddy.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: native-ubuntu24-rust1.95-${{ hashFiles('Cargo.lock', 'upstream/pin.json', 'upstream/*.patch') }}
          restore-keys: |
            native-ubuntu24-rust1.95-
      - name: Prove managed download regression before and after the fix
        run: python3 scripts/check_managed_backpressure.py
      - run: cargo test --locked -p solartt-agent -- --test-threads=1
      - run: cargo build --locked --release -p solartt-agent -p solartt-panel -p solartt-admin
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Isolated release measurements
        run: |
          mkdir -p dist
          cargo test --locked --release -p solartt-agent --test transport measure_loopback_transport_and_durable_leases -- --ignored --nocapture --test-threads=1 | tee dist/measurements.txt
      - run: cargo metadata --locked --format-version 1 | python3 scripts/licenses.py
      - run: python3 scripts/license_review.py
      - name: Package with a private builder umask
        run: |
          umask 077
          python3 scripts/package.py
      - run: python3 scripts/package_verify.py
      - run: python3 scripts/package_smoke.py
      - name: Scan unpacked packages and artifact files for secrets
        run: python3 scripts/security_check.py artifacts
      - name: Service diagnostics on failure
        if: failure()
        run: sudo journalctl -u solartt-agent.service -u solartt-panel.service --no-pager -n 100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solartt-linux-x86_64-development
          path: dist/
          retention-days: 7
  pilot:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOLARTT_PILOT_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev pkg-config python3-h2 openssl
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: solartt-linux-x86_64-development
          path: dist/current
      - run: python3 scripts/prepare_pilot_baseline.py
      - run: python3 scripts/prepare_client.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: pilot-baseline-rust1.95-7ec4b1779e20bb3268e704c82a397742e34d81ae
          restore-keys: |
            native-ubuntu24-rust1.95-
      - name: Build the actual pinned alpha.1 binaries
        working-directory: .dev/pilot-baseline
        run: cargo build --locked --release -p solartt-agent -p solartt-panel -p solartt-admin
      - name: Package original alpha.1 with its dependency notices
        working-directory: .dev/pilot-baseline
        run: |
          cargo metadata --locked --format-version 1 | python3 scripts/licenses.py
          python3 scripts/package.py
      - name: Fresh VM upgrade, compatible rollback and schema-2 recovery
        run: python3 scripts/pilot_upgrade.py
      - name: Scan downloaded packages and pilot report
        run: python3 scripts/security_check.py artifacts
      - name: Pilot service diagnostics on failure
        if: failure()
        run: sudo journalctl -u solartt-agent.service -u solartt-panel.service --no-pager -n 100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solartt-isolated-upgrade-pilot
          path: dist/
          retention-days: 7
  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev pkg-config
      - run: python3 scripts/prepare_upstream.py
      - name: Resolve the reviewed h2 upgrade against the upstream lockfile
        run: cargo update --manifest-path .upstream/lib/Cargo.toml --workspace
      - name: Patched upstream regression tests with upstream lockfile
        run: cargo test --manifest-path .upstream/lib/Cargo.toml --locked --lib -- --test-threads=1
        env:
          CARGO_TARGET_DIR: target/upstream-regression

  minimal:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: solartt-linux-x86_64-development
          path: dist/current
      - name: Prepare runtime-only Ubuntu test image
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          mkdir -p .dev/minimal-context dist/minimal
          cp dist/current/*.deb .dev/minimal-context/solartt.deb
          cp scripts/minimal_runtime.py .dev/minimal-context/
          docker build --file packaging/minimal-runtime.Dockerfile --tag solartt-minimal-runtime .dev/minimal-context
      - name: Exercise packaged runtime without a build toolchain
        run: |
          docker run --rm --network none --mount type=bind,src="$PWD/dist/minimal",dst=/report solartt-minimal-runtime
          docker image inspect solartt-minimal-runtime --format '{{.Id}}' > dist/minimal/runtime-image-id.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solartt-minimal-runtime
          path: dist/minimal/
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [security, portable, native, legacy, pilot, minimal]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: solartt-linux-x86_64-development
          path: dist/release-input
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: solartt-isolated-upgrade-pilot
          path: dist/pilot
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: solartt-minimal-runtime
          path: dist/minimal
      - name: Publish verified alpha assets
        run: python3 scripts/publish_alpha.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
