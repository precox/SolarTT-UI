name: Watch TrustTunnel releases
run-name: >-
  Watch TrustTunnel releases${{ inputs.notification_test && inputs.notification_test != 'none' && format(' [TEST] {0}', inputs.notification_test) || '' }}
on:
  schedule:
    - cron: '23 7 * * 1' # Mondays, 07:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report candidates; do not create issues'
        type: boolean
        default: false
      notification_test:
        description: 'Controlled TEST issue only; skips release discovery (dry_run must be false for delivery)'
        type: choice
        default: none
        options:
          - none
          - failure
          - recovery
permissions: {}
concurrency:
  group: watch-trusttunnel-releases
  cancel-in-progress: false
jobs:
  watch:
    if: >-
      github.repository == 'precox/SolarTT-UI' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      observed_run_id: ${{ steps.observation.outputs.run_id }}
      observed_attempt: ${{ steps.observation.outputs.attempt }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record this watcher job's execution identity
        id: observation
        run: |
          printf 'run_id=%s\nattempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test release selection and issue idempotency
        run: python3 -B -m unittest discover -s scripts -p 'test_*trusttunnel*.py'
      - name: Validate manual test selection
        env:
          NOTIFICATION_TEST: ${{ inputs.notification_test || 'none' }}
        run: |
          case "$NOTIFICATION_TEST" in
            none|failure|recovery) ;;
            *) echo '::error::Invalid notification test mode'; exit 1 ;;
          esac
      - name: '[TEST] Deliberately fail to exercise notification delivery'
        if: github.event_name == 'workflow_dispatch' && inputs.notification_test == 'failure'
        run: |
          echo '::error::TEST ONLY: deliberate failure for notification delivery; no upstream discovery or server changes'
          exit 1
      - name: Discover stable releases and file maintenance tasks
        if: inputs.notification_test == 'none' || !inputs.notification_test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [[ "$DRY_RUN" != true ]]; then args+=(--create-issues); fi
          python3 -B scripts/watch_trusttunnel.py "${args[@]}"
  report-health:
    needs: watch
    if: >-
      always() && github.repository == 'precox/SolarTT-UI' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.dry_run != true &&
      (needs.watch.result == 'failure' || needs.watch.result == 'cancelled' || needs.watch.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Report failure or recovery without copying diagnostic logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH_RESULT: ${{ needs.watch.result == 'success' && 'success' || 'failure' }}
          WATCH_RUN_ID: ${{ needs.watch.outputs.observed_run_id }}
          WATCH_ATTEMPT: ${{ needs.watch.outputs.observed_attempt }}
          NOTIFICATION_TEST: ${{ inputs.notification_test || 'none' }}
        run: |
          args=()
          case "$NOTIFICATION_TEST" in
            none) ;;
            failure|recovery) args+=(--notification-test) ;;
            *) echo '::error::Invalid notification test mode'; exit 1 ;;
          esac
          python3 -B scripts/report_trusttunnel_health.py --result "$WATCH_RESULT" --create-issues "${args[@]}"
