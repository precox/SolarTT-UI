# Reviewed integration example; install only after reconciling existing listeners.
# HAProxy passes TLS through; each backend terminates its own TLS.
global
    maxconn 1024

defaults
    mode tcp
    timeout connect 5s
    timeout client 24h
    timeout server 24h
    timeout client-fin 30s
    timeout server-fin 30s

frontend shared_tls
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend managed_tunnel if { req.ssl_sni -i media.example.org }
    default_backend existing_caddy

backend managed_tunnel
    # TrustTunnel does not accept PROXY headers; its peer address is loopback.
    server managed 127.0.0.1:9443

backend existing_caddy
    # Caddy must parse PROXY v2 before TLS and trust only the local proxy peer.
    server existing 127.0.0.1:8443 send-proxy-v2
